name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.tools/android-user-home
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test APK metadata parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6

      - name: Install required SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Confirm Android SDK is available
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Run tests, build APK and lint
        timeout-minutes: 18
        run: bash scripts/ci-build.sh

      - name: Execute uninstalled guest APK on Android 16
        timeout-minutes: 15
        run: bash scripts/ci-container-smoke.sh

      - name: Verify APK signature, permissions and alignment
        shell: bash
        run: python3 scripts/verify-apk.py | tee apk-verification.txt

      - name: Package phone test files
        run: python3 scripts/package-probe.py

      - name: Upload APK and phone test instructions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LCBLauncher-container-alpha-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LCBLauncher-check-reports
          path: |
            container-check/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
