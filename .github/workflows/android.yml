name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.tools/android-user-home
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test APK metadata parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6

      - name: Install required SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Confirm Android SDK is available
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Run tests, build APK and lint
        timeout-minutes: 18
        run: bash scripts/ci-build.sh

      - name: Verify APK signature, permissions and alignment
        run: python3 scripts/verify-apk.py
